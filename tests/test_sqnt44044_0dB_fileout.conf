## TEST CONFIG - output goes to a raw file instead of hw:ADDA,0, so it
## never touches real hardware. Same real Cor1/Cor2 coeffs, /20 -> /0,
## as test_sqnt44044_0dB.conf, but a bounded (non-looping) input tone so
## the run ends on its own.
##
## CAVEAT (2026-08-22): this "file" output path gave inconsistent,
## clearly-buggy results in practice -- e.g. exact-zero output on
## channels that should carry signal, and results that changed just from
## changing the declared total channel count (8/0,1,2,3 vs plain 4) with
## nothing else different. Treat this config as unreliable for anything
## beyond "does it start up cleanly" smoke-testing. The trustworthy way
## to measure real output level is test_sqnt44044_0dB.conf against real
## hardware, queried via the cli's `ppk` command -- not this file-output
## rig.
##
## Paths below are relative to this file's directory -- always `cd` here
## before invoking brutefir with this file. Run generate_test_tones.py
## first if tones/ doesn't exist yet.

float_bits: 64;
sampling_rate: 44100;
filter_length: 1024,128;
sdf_length: 31;
overflow_warnings: true;
show_progress: false;
max_dither_table_size: 0;
allow_poll_mode: true;
modules_path: "/usr/local/lib/brutefir";
monitor_rate: true;
powersave: false;
lock_memory: true;
convolver_config: "/home/hs/.brutefir_convolver";

## LOGIC ##

logic:
"cli" { port: 3002; };

## COEFFS (same files as live sqnt44044) ##

coeff "esll" {
       filename: "/home/hs/brutefir/filter/sqnt440/Cor2L44.dbl";
	format: "FLOAT64_LE";
};

coeff "eslr" {
       filename: "/home/hs/brutefir/filter/sqnt440/Cor2R44.dbl";
	format: "FLOAT64_LE";
};
coeff "subl" {
       filename: "/home/hs/brutefir/filter/sqnt440/Cor1L44.dbl";
	format: "FLOAT64_LE";
};

coeff "subr" {
       filename: "/home/hs/brutefir/filter/sqnt440/Cor1R44.dbl";
	format: "FLOAT64_LE";
};

## INPUT, OUTPUT ##

input "leftin", "rightin" {
        device: "file" { path: "tones/tone_0dbfs_1k_2ch_input.raw"; loop: false; };
        sample: "S32_LE";
	channels: 2;
};

output "subl", "subr", "esll", "eslr" {
        device: "file" { path: "fileout_0dB.raw"; };
        sample: "S32_LE";
	channels: 4;
        delay: 0,1,10,10;
        subdelay: 0,0,0,50;
	dither: false;
};

## FILTERS - same as live, only /20 -> /0 ##

filter "lhifilter" {
        from_inputs: "leftin"/0;
        process: 0;
        to_outputs: "esll"/0;
	coeff: "esll";
};

filter "rhifilter" {
        from_inputs: "rightin"/0;
        process: 1;
        to_outputs: "eslr"/0;
	coeff: "eslr";
};

filter "llofilter" {
        from_inputs: "leftin"/0.0;
        process: 2;
        to_outputs: "subl"/0;
	coeff: "subl";
};

filter "rlofilter" {
        from_inputs: "rightin"/0.0;
        process: 3;
        to_outputs: "subr"/0;
	coeff: "subr";
};
