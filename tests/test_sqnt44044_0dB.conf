## TEST CONFIG - non-destructive copy of config/sqnt440/sqnt44044
## Only two changes vs. the live config:
##   1. input is a looping 0 dBFS 1kHz file tone instead of hw:Loopback,1,0
##   2. to_outputs attenuation changed from /20 to /0 on all four filters
## Everything else (coeffs, delays, filter structure) is untouched.
##
## Real hardware output (hw:ADDA,0) -- confirm no other BruteFIR instance
## holds the device first, and warn before running if anyone is watching
## the Mytek's front panel.
##
## Paths below are relative to this file's directory ("file" device paths
## are resolved relative to the BruteFIR process's cwd, not the config's
## location) -- always `cd` here before invoking brutefir with this file.
## Run generate_test_tones.py first if tones/ doesn't exist yet.
##
## Query the real digital level directly instead of trusting the Mytek's
## (coarse, stepped) front-panel LEDs -- connect to the cli port and run
## `rpk;` then, after a couple seconds, `ppk;`:
##   nc localhost 3001
## (confirmed 2026-08-22: this read -6.70 dB / -8.95 dB on esll/eslr for
## a true 0 dBFS 1kHz input -- matches the real Cor2 filter's passband
## dip at 1kHz exactly; the Mytek's "-20dB" LED for the same signal was
## just its coarse threshold ladder, not a real discrepancy.)

float_bits: 64;
sampling_rate: 44100;
filter_length: 1024,128;
sdf_length: 31;
overflow_warnings: true;
show_progress: false;
max_dither_table_size: 0;
allow_poll_mode: true;
modules_path: "/usr/local/lib/brutefir";
monitor_rate: true;
powersave: true;
lock_memory: true;
convolver_config: "/home/hs/.brutefir_convolver";

## LOGIC ##

logic:
"cli" { port: 3001; };  # different port than live (3000), avoid any collision

## COEFFS (same files as live sqnt44044) ##

coeff "esll" {
       filename: "/home/hs/brutefir/filter/sqnt440/Cor2L44.dbl";
	format: "FLOAT64_LE";
};

coeff "eslr" {
       filename: "/home/hs/brutefir/filter/sqnt440/Cor2R44.dbl";
	format: "FLOAT64_LE";
};
coeff "subl" {
       filename: "/home/hs/brutefir/filter/sqnt440/Cor1L44.dbl";
	format: "FLOAT64_LE";
};

coeff "subr" {
       filename: "/home/hs/brutefir/filter/sqnt440/Cor1R44.dbl";
	format: "FLOAT64_LE";
};

## INPUT, OUTPUT ##

input "leftin", "rightin" {
        device: "file" { path: "tones/tone_0dbfs_1k_2ch_input.raw"; loop: true; };
        sample: "S32_LE";
	channels: 2;
};

output "subl", "subr", "esll", "eslr" {
        device: "alsa" { device: "hw:ADDA,0"; };
        sample: "S32_LE";
	channels: 8/0,1,2,3;
        delay: 0,1,10,10;
        subdelay: 0,0,0,50;
	dither: false;
};

## FILTERS - same as live, only /20 -> /0 ##

filter "lhifilter" {
        from_inputs: "leftin"/0;
        process: 0;
        to_outputs: "esll"/0;
	coeff: "esll";
};

filter "rhifilter" {
        from_inputs: "rightin"/0;
        process: 1;
        to_outputs: "eslr"/0;
	coeff: "eslr";
};

filter "llofilter" {
        from_inputs: "leftin"/0.0;
        process: 2;
        to_outputs: "subl"/0;
	coeff: "subl";
};

filter "rlofilter" {
        from_inputs: "rightin"/0.0;
        process: 3;
        to_outputs: "subr"/0;
	coeff: "subr";
};
